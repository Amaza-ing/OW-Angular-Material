<mat-toolbar class="footer-toolbar">
  <div class="footer-content">
    <span>&copy; Mi Landing Page</span>
    <span class="spacer"></span>
    <nav>
      <a mat-button>Privacidad</a>
      <a mat-button>Términos</a>
      <a mat-button>Contacto</a>
    </nav>
  </div>
</mat-toolbar>

<div class="footer-form">
  <h3>Contacto rápido</h3>
  <form>
    <mat-form-field appearance="fill">
      <mat-label>Nombre</mat-label>
      <input matInput placeholder="Tu nombre" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput type="email" placeholder="tu@email.com" />
    </mat-form-field>

    <button mat-raised-button>Enviar</button>
  </form>
</div>
