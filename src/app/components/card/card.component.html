<mat-card class="example-card" appearance="raised">
  <mat-card-header>
    <mat-card-title-group>
      <mat-card-title>{{ cardInfo().title }}</mat-card-title>
      <mat-card-subtitle>{{ cardInfo().subtitle }}</mat-card-subtitle>
      <img mat-card-md-image [src]="cardInfo().img" [alt]="cardInfo().alt" />
    </mat-card-title-group>
  </mat-card-header>
  <mat-card-content>
    {{ cardInfo().text }}
  </mat-card-content>
</mat-card>
